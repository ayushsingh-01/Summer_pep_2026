version: '3.8'

services:
  db:
    image: postgres:15
    container_name: pv_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
      - "55432:5432"
    volumes:
      - pv_data:/var/lib/postgresql/data
      - ./password_vault_sql:/docker-entrypoint-initdb.d:ro

volumes:
  pv_data:
